<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e1e1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>agy webide</title>
<link rel="stylesheet" href="{{XTERM}}/css/xterm.css">
<style>
  :root { --bg:#1e1e1e; --panel:#252526; --line:#333; --fg:#ccc; --dim:#888; --accent:#0e639c; --sel:#37373d; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:13px system-ui, sans-serif; overflow:hidden; }
  button, select, input, textarea { font:inherit; color:inherit; background:#3c3c3c; border:1px solid #454545; border-radius:3px; padding:3px 8px; }
  button { cursor:pointer; } button:hover:not(:disabled) { background:#4a4a4a; }
  button:disabled { opacity:.4; cursor:default; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; } button.primary:hover:not(:disabled) { background:#1177bb; }
  button.on { background:#094771; border-color:#0e639c; }
  #app { display:flex; height:100vh; }

  /* сайдбар */
  #side { width:var(--sidew,300px); min-width:200px; display:flex; flex-direction:column; background:var(--panel); flex:none; }
  #side-top { display:flex; gap:6px; padding:8px; }
  #proj { flex:1; min-width:0; }
  #side-tabs { display:flex; border-bottom:1px solid var(--line); }
  #side-tabs button { flex:1; border:0; border-radius:0; background:none; padding:6px; color:var(--dim); border-bottom:2px solid transparent; }
  #side-tabs button.on { color:#fff; border-bottom-color:var(--accent); }
  .badge { display:inline-block; min-width:16px; padding:0 4px; margin-left:4px; border-radius:8px; background:var(--accent); color:#fff; font-size:11px; text-align:center; }
  .panel { flex:1; min-height:0; overflow:auto; display:none; }
  .panel.on { display:block; }
  #p-files.on { display:flex; flex-direction:column; overflow:hidden; }
  #files-bar { display:flex; gap:4px; padding:4px 8px; border-bottom:1px solid var(--line); flex:none; }
  #files-bar button { padding:1px 7px; }
  #tree { flex:1; overflow:auto; outline:none; padding-bottom:40px; }
  #tree .row { display:flex; gap:6px; padding:2px 8px; cursor:pointer; user-select:none; }
  #tree .row .nm { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #tree .row:hover, .res-line:hover, .res-file:hover, .grow:hover { background:var(--sel); }
  #tree .row.sel { background:#2a2d2e; } #tree .row.active { background:#094771; color:#fff; }
  #tree .dir { color:#ddd; }
  #tree .row .bd { font-size:11px; opacity:.9; }
  .g-M { color:#e2c08d; } .g-A, .g-U, .g-R { color:#73c991; } .g-D { color:#c74e39; } .g-C { color:#f14c4c; } .g-dirty { color:#e2c08d; }
  #search-box { padding:8px; display:flex; flex-wrap:wrap; gap:6px; position:sticky; top:0; background:var(--panel); z-index:2; }
  #q { flex:1 1 100%; }
  .opt { display:flex; align-items:center; gap:4px; color:var(--dim); } .opt input { padding:0; }
  .res-head { padding:4px 8px; background:#2d2d30; color:#9cdcfe; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .res-line, .res-file { padding:1px 8px 1px 18px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; cursor:pointer; }
  .res-line b { color:var(--dim); font-weight:normal; margin-right:8px; }
  .note { padding:8px; color:var(--dim); }

  /* git */
  #p-git.busy { opacity:.55; pointer-events:none; }
  #p-git .pad { padding:8px; display:flex; flex-direction:column; gap:6px; }
  #p-git .line { display:flex; gap:6px; align-items:center; }
  #p-git .line > select { flex:1; min-width:0; }
  #g-msg { width:100%; min-height:54px; resize:vertical; background:#3c3c3c; }
  .g-head { display:flex; align-items:center; padding:3px 8px; background:#2d2d30; font-weight:600; font-size:11px; text-transform:uppercase; letter-spacing:.3px; }
  .g-head span { flex:1; }
  .grow { display:flex; align-items:center; gap:6px; padding:2px 8px 2px 14px; cursor:pointer; }
  .grow .l { width:12px; text-align:center; font-weight:600; flex:none; }
  .grow .n { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .grow .n i { color:var(--dim); font-style:normal; margin-left:6px; }
  .grow .acts { display:none; gap:2px; } .grow:hover .acts { display:flex; }
  .ib { padding:0 6px; line-height:18px; border:0; background:none; font-size:14px; } .ib:hover { background:#555 !important; }
  details summary { cursor:pointer; padding:4px 8px; background:#2d2d30; font-weight:600; font-size:11px; text-transform:uppercase; }
  .logl { padding:2px 8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .logl b { color:#dcdcaa; font-weight:normal; margin-right:6px; font-family:monospace; } .logl i { color:var(--dim); font-style:normal; }

  /* сплиттеры */
  .split { flex:none; background:var(--line); } .split:hover, .split.drag { background:var(--accent); }
  #splitV { width:4px; cursor:col-resize; } #splitH { height:4px; cursor:row-resize; }

  /* правая часть */
  #main { flex:1; min-width:0; display:flex; flex-direction:column; }
  #editor-wrap { flex:1; min-height:80px; display:flex; flex-direction:column; }
  #tabbar { display:flex; background:var(--panel); flex:none; }
  #tabs { display:flex; overflow-x:auto; flex:1; min-height:30px; }
  #tools { display:flex; gap:4px; padding:3px 6px; flex:none; align-items:center; }
  #tools button { padding:1px 8px; }
  .tab { display:flex; align-items:center; gap:6px; padding:0 10px; height:30px; cursor:pointer; color:var(--dim); border-right:1px solid var(--line); white-space:nowrap; }
  .tab.on { background:var(--bg); color:#fff; }
  .tab .x { opacity:.5; padding:0 3px; border-radius:3px; } .tab .x:hover { opacity:1; background:#555; }
  .tab .dot { color:#e2c08d; } .tab.conflict .name { color:#f48771; }
  #banner { flex:none; align-items:center; gap:12px; padding:5px 10px; background:#5a4a1d; color:#fff; }
  #banner #bn-text { flex:1; } #banner #bn-btns { display:flex; gap:6px; }
  .tab.gone .name { text-decoration:line-through; }
  #editor-box { position:relative; flex:1; min-height:0; }
  #editor, #diff { position:absolute; inset:0; }
  #diff { display:none; }
  #empty { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--dim); pointer-events:none; }

  /* indent-rainbow */
  .ir0 { background:rgba(255,255,64,.07); } .ir1 { background:rgba(127,255,127,.07); }
  .ir2 { background:rgba(255,127,255,.07); } .ir3 { background:rgba(79,236,236,.07); }
  .irerr { background:rgba(128,32,32,.6); }

  #termwrap { height:var(--termh,35vh); min-height:80px; display:flex; flex-direction:column; flex:none; }
  #term-bar { display:flex; align-items:center; gap:8px; padding:3px 8px; background:var(--panel); color:var(--dim); flex:none; }
  #term-bar #term-title { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #term-body { flex:1; min-height:0; background:#1e1e1e; overflow:hidden; }
  .xterm { padding:4px 6px; height:100%; }

  /* лимиты */
  .limits-bar { display:flex; align-items:center; gap:6px; flex:none; }
  .limit-chip { position:relative; display:inline-flex; align-items:center; gap:6px; background:#2d2d30; border:1px solid #454545; border-radius:3px; padding:2px 7px; font-size:12px; line-height:16px; user-select:none; cursor:pointer; }
  .limit-chip:hover { background:#38383d; border-color:#666; }
  .limit-chip .grp { color:#9cdcfe; font-weight:500; }
  .limit-item { position:relative; display:inline-flex; align-items:center; gap:3px; }
  .limit-item .val { font-weight:600; font-family:ui-monospace, monospace; }
  .limit-item .val.ok { color:#73c991; }
  .limit-item .val.warn { color:#e2c08d; }
  .limit-item .val.crit { color:#f14c4c; }
  .limit-item .win { color:var(--dim); font-size:10px; margin-left:1px; }
  .limit-chip.loading { opacity:.7; cursor:wait; }
  .limit-chip.err { color:#f48771; border-color:#803030; }
  .limit-mini-bar { width:24px; height:4px; background:#3c3c3c; border-radius:2px; overflow:hidden; display:inline-block; vertical-align:middle; margin-left:2px; }
  .limit-mini-fill { height:100%; border-radius:2px; }
  .limit-mini-fill.ok { background:#73c991; }
  .limit-mini-fill.warn { background:#e2c08d; }
  .limit-mini-fill.crit { background:#f14c4c; }

  /* всплывающая подсказка с точным процентом при наведении */
  .limit-item .limit-tip {
    position:absolute; bottom:calc(100% + 7px); left:50%; transform:translateX(-50%) translateY(4px);
    background:#18181b; color:#fff; border:1px solid #4f4f56; border-radius:4px; padding:4px 8px;
    font-size:11px; font-weight:normal; line-height:14px; white-space:nowrap; pointer-events:none;
    box-shadow:0 4px 14px rgba(0,0,0,0.7); z-index:1000; opacity:0; visibility:hidden;
    transition:opacity .12s ease, transform .12s ease;
  }
  .limit-item .limit-tip::after {
    content:''; position:absolute; top:100%; left:50%; margin-left:-4px;
    border:4px solid transparent; border-top-color:#18181b;
  }
  .limit-item:hover .limit-tip { opacity:1; visibility:visible; transform:translateX(-50%) translateY(0); }

  /* модалка лимитов */
  .limits-table { width:100%; border-collapse:collapse; margin-top:8px; font-size:12px; }
  .limits-table th { text-align:left; padding:6px 8px; border-bottom:1px solid var(--line); color:var(--dim); font-weight:600; text-transform:uppercase; font-size:11px; }
  .limits-table td { padding:6px 8px; border-bottom:1px solid #333; vertical-align:middle; }
  .limits-pbar { height:6px; background:#3c3c3c; border-radius:3px; overflow:hidden; width:100px; }
  .limits-pfill { height:100%; border-radius:3px; }
  .limits-raw { background:#1e1e1e; border:1px solid var(--line); border-radius:4px; padding:8px; font-family:ui-monospace, monospace; font-size:11px; max-height:200px; overflow:auto; white-space:pre-wrap; word-break:break-word; color:#bbb; margin-top:4px; }

  #toast { position:fixed; right:14px; bottom:14px; background:#5a1d1d; color:#fff; padding:8px 12px; border-radius:4px; display:none; max-width:460px; z-index:99; white-space:pre-wrap; }
  #toast.ok { background:#1f4a2e; }
  #ctx { position:fixed; z-index:98; background:#2d2d30; border:1px solid #454545; border-radius:4px; padding:4px 0; min-width:170px; box-shadow:0 4px 14px #0008; display:none; }
  #ctx div { padding:4px 14px; cursor:pointer; } #ctx div:hover { background:var(--accent); color:#fff; }
  #modal { position:fixed; inset:0; background:#0007; display:flex; align-items:flex-start; justify-content:center; padding-top:14vh; z-index:100; }
  .dlg { background:#2d2d30; border:1px solid #454545; border-radius:6px; padding:14px; width:min(420px, 92vw); display:flex; flex-direction:column; gap:10px; }
  .dlg h3 { margin:0; font-size:14px; } .dlg label { display:flex; flex-direction:column; gap:4px; color:var(--dim); }
  .dlg.wide { width:min(780px, 96vw); max-height:82vh; overflow:auto; }
  .dlg.wide .btns { position:sticky; bottom:-14px; margin:0 -14px -14px; padding:10px 14px; background:#2d2d30; border-top:1px solid var(--line); }
  .dlg h4 { margin:6px 0 0; padding-bottom:4px; border-bottom:1px solid var(--line); font-size:12px; text-transform:uppercase; letter-spacing:.3px; color:#9cdcfe; }
  .fgrid { display:grid; grid-template-columns:1fr 1fr; gap:8px 16px; align-items:start; }
  @media (max-width:640px) { .fgrid { grid-template-columns:1fr; } }
  .fld { display:flex; flex-direction:column; gap:3px; } .fld.chk { flex-direction:row; align-items:center; gap:8px; color:var(--fg); }
  .fld.chk input { width:auto; } .fld.full { grid-column:1 / -1; }
  .fld small { color:var(--dim); } .fld.warn span { color:#f48771; }
  .fld textarea { font-family:ui-monospace, monospace; min-height:60px; resize:vertical; }
  .dlg .hint { color:var(--dim); margin:0; } .dlg .hint code { color:var(--fg); }
  .dlg input[type=text], .dlg input[type=number], .dlg select, .dlg textarea { width:100%; color:var(--fg); }
  .dlg input { color:var(--fg); } .dlg .btns { display:flex; justify-content:flex-end; gap:8px; }

  /* языковая модалка */
  .lang-list { display:flex; flex-direction:column; gap:6px; margin:8px 0; }
  .lang-opt { display:flex; align-items:center; gap:8px; padding:7px 10px; background:#38383d; border:1px solid #484848; border-radius:3px; cursor:pointer; font-weight:500; }
  .lang-opt:hover { background:#45454a; }
  .lang-opt.active { border-color:var(--accent); background:#094771; color:#fff; }
  .lang-tools { display:flex; flex-direction:column; gap:6px; margin:8px 0 4px; padding-top:10px; border-top:1px solid var(--line); }
  .lang-tools button { text-align:left; }

  /* ───────── мобильная адаптация (<= 768px) ───────── */
  #mobile-nav { display:none; }
  #term-keys { display:none; }

  @media (max-width: 768px) {
    :root {
      --mobnav-h: 52px;
    }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      width: 100%;
      position: fixed;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: calc(100% - var(--mobnav-h) - env(safe-area-inset-bottom, 0px));
      height: calc(var(--vh, 100dvh) - var(--mobnav-h) - env(safe-area-inset-bottom, 0px));
      width: 100%;
      overflow: hidden;
      position: relative;
    }

    /* Нижняя панель навигации */
    #mobile-nav {
      display: flex;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: calc(var(--mobnav-h) + env(safe-area-inset-bottom, 0px));
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: var(--panel);
      border-top: 1px solid var(--line);
      z-index: 50;
      user-select: none;
    }
    .mob-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      background: none;
      border: none;
      border-radius: 0;
      padding: 4px 2px;
      color: var(--dim);
      font-size: 11px;
      position: relative;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .mob-btn .mob-icon {
      font-size: 18px;
      line-height: 1.1;
      transition: transform .15s ease;
    }
    .mob-btn.on {
      color: #fff;
      background: rgba(14, 99, 156, 0.2);
    }
    .mob-btn.on .mob-icon {
      transform: scale(1.12);
    }
    .mob-btn .badge {
      position: absolute;
      top: 5px;
      right: calc(50% - 16px);
      width: 8px;
      height: 8px;
      min-width: 8px;
      padding: 0;
      border-radius: 50%;
      background: #e2c08d;
    }

    /* Сплиттер между сайдбаром и окном на мобильных не нужен */
    #splitV { display: none !important; }

    /* Переключение видов (Sidebar / Editor / Terminal / Split) */
    body:not([data-mob-view]) #side,
    body[data-mob-view="sidebar"] #side {
      display: flex !important;
      width: 100% !important;
      flex: 1 1 100% !important;
      height: 100% !important;
    }
    body:not([data-mob-view]) #main,
    body[data-mob-view="sidebar"] #main {
      display: none !important;
    }

    body[data-mob-view="editor"] #side { display: none !important; }
    body[data-mob-view="editor"] #main {
      display: flex !important;
      width: 100% !important;
      flex: 1 1 100% !important;
      height: 100% !important;
    }
    body[data-mob-view="editor"] #editor-wrap {
      display: flex !important;
      flex: 1 1 100% !important;
      height: 100% !important;
    }
    body[data-mob-view="editor"] #splitH { display: none !important; }
    body[data-mob-view="editor"] #termwrap { display: none !important; }

    body[data-mob-view="terminal"] #side { display: none !important; }
    body[data-mob-view="terminal"] #main {
      display: flex !important;
      width: 100% !important;
      flex: 1 1 100% !important;
      height: 100% !important;
    }
    body[data-mob-view="terminal"] #editor-wrap { display: none !important; }
    body[data-mob-view="terminal"] #splitH { display: none !important; }
    body[data-mob-view="terminal"] #termwrap {
      display: flex !important;
      flex: 1 1 100% !important;
      height: 100% !important;
      min-height: 0 !important;
    }

    body[data-mob-view="split"] #side { display: none !important; }
    body[data-mob-view="split"] #main {
      display: flex !important;
      width: 100% !important;
      flex: 1 1 100% !important;
      height: 100% !important;
    }
    body[data-mob-view="split"] #editor-wrap {
      display: flex !important;
      flex: 1 1 auto !important;
      min-height: 110px !important;
    }
    body[data-mob-view="split"] #splitH {
      display: block !important;
      height: 12px !important;
      background: #2d2d30 !important;
      touch-action: none !important;
      position: relative !important;
      border-top: 1px solid var(--line) !important;
      border-bottom: 1px solid var(--line) !important;
    }
    body[data-mob-view="split"] #splitH::after {
      content: '';
      position: absolute;
      top: 4px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 3px;
      background: var(--dim);
      border-radius: 2px;
    }
    body[data-mob-view="split"] #termwrap {
      display: flex !important;
      height: var(--termh, 45vh) !important;
      min-height: 110px !important;
      flex: none !important;
    }

    /* Мобильная панель быстрых клавиш терминала */
    #term-keys {
      display: flex;
      overflow-x: auto;
      gap: 5px;
      padding: 5px 8px;
      background: #141416;
      border-top: 1px solid var(--line);
      flex: none;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      touch-action: pan-x;
    }
    #term-keys::-webkit-scrollbar { display: none; }
    .tkey {
      flex: 0 0 auto;
      min-width: 38px;
      height: 34px;
      padding: 0 9px;
      font-size: 13px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 600;
      background: #2a2a2d;
      border: 1px solid #444;
      border-radius: 5px;
      color: #e0e0e0;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .tkey:active {
      background: var(--accent);
      color: #fff;
      transform: scale(0.96);
    }
    .tkey-enter {
      background: #094771;
      border-color: #0e639c;
      color: #fff;
      font-weight: bold;
    }

    /* Удобные размеры касаний для мобильных */
    button, select, input, textarea {
      font-size: 14px;
    }
    /* 16px на полях ввода предотвращает нежелательный зум страницы в iOS Safari */
    input[type=text], input[type=number], input[type=search], select, textarea {
      font-size: 16px !important;
    }
    #proj { height: 38px; }
    #newproj { width: 38px; height: 38px; font-size: 20px; }
    #side-top { padding: 8px; }
    #side-tabs button {
      padding: 10px 4px;
      font-size: 14px;
      height: 42px;
    }
    #files-bar { padding: 6px 8px; gap: 6px; }
    #files-bar button {
      padding: 4px 12px;
      font-size: 15px;
      height: 32px;
    }
    #tree .row {
      padding: 6px 8px;
      min-height: 34px;
      align-items: center;
      font-size: 14px;
    }
    .grow {
      padding: 6px 8px 6px 12px;
      min-height: 36px;
    }
    /* Кнопки действий Git (+, -, ↩) всегда видимы на сенсорных экранах */
    .grow .acts {
      display: flex !important;
    }
    .grow .acts button {
      min-width: 32px;
      height: 30px;
      padding: 0 8px;
      font-size: 16px;
      background: #3c3c3c;
      border: 1px solid #4a4a4a;
      border-radius: 4px;
      margin-left: 3px;
    }
    .tab {
      height: 38px;
      padding: 0 12px;
      font-size: 13px;
    }
    .tab .x {
      padding: 4px 8px;
      font-size: 18px;
    }
    #tools button {
      padding: 4px 8px;
      height: 30px;
      font-size: 12px;
    }
    #term-bar {
      padding: 5px 8px;
      gap: 6px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    #term-bar::-webkit-scrollbar { display: none; }
    #term-bar button {
      padding: 3px 8px;
      height: 28px;
      font-size: 12px;
      white-space: nowrap;
    }
    #term-title {
      max-width: 110px;
      font-size: 12px;
    }
    .limit-chip {
      padding: 2px 6px;
      font-size: 11px;
    }
    #toast {
      left: 12px;
      right: 12px;
      bottom: calc(var(--mobnav-h) + 12px + env(safe-area-inset-bottom, 0px));
      max-width: none;
      text-align: center;
      font-size: 13px;
    }
    #modal {
      padding: 12px;
      align-items: center;
    }
    .dlg {
      width: 95vw;

function t(path, params) {
  const getVal = dict => {
    if (!dict) return undefined;
    return path.split('.').reduce((acc, k) => (acc != null ? acc[k] : undefined), dict);
  };
  let val;
  if (currentLang === 'custom') val = getVal(I18N.custom);
  if (val === undefined) val = getVal(I18N[currentLang]);
  if (val === undefined && currentLang !== 'en') val = getVal(I18N.en);
  if (val === undefined && currentLang !== 'ru') val = getVal(I18N.ru);
  if (val === undefined) return path;

  if (params && typeof val === 'string') {
    for (const [k, v] of Object.entries(params)) {
      val = val.replace(new RegExp('\\{' + k + '\\}', 'g'), v != null ? v : '');
    }
  }
  return val;
}

function applyI18n() {
  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t(el.dataset.i18n);
  });
  document.querySelectorAll('[data-i18n-title]').forEach(el => {
    el.title = t(el.dataset.i18nTitle);
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el => {
    el.placeholder = t(el.dataset.i18nPh);
  });
  const customName = localStorage.getItem('agy_custom_lang_name') || 'Custom';
  const btn = $('#btn-lang');
  if (btn) btn.textContent = currentLang === 'custom' ? ('🌐 ' + customName) : (currentLang === 'en' ? '🌐 EN' : '🌐 RU');
  document.documentElement.lang = currentLang === 'ru' ? 'ru' : 'en';
}

async function loadLocales() {
  const tryFetch = async (relPath) => {
    try {
      const r = await fetch(api(relPath));
      if (r.ok) return await r.json();
    } catch (e) {}
    try {
      const r = await fetch(relPath);
      if (r.ok) return await r.json();
    } catch (e) {}
    return null;
  };
  try {
    const [rRu, rEn] = await Promise.all([
      tryFetch('/api/lang/ru.json'),
      tryFetch('/api/lang/en.json'),
    ]);
    if (rRu && typeof rRu === 'object') I18N.ru = { ...DEFAULT_RU, ...rRu };
    if (rEn && typeof rEn === 'object') I18N.en = { ...DEFAULT_EN, ...rEn };

function downloadEnTemplate() {
  const dict = I18N.en || DEFAULT_EN;
  const blob = new Blob([JSON.stringify(dict, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'en.json';
  a.click();
  URL.revokeObjectURL(url);
}

function uploadCustomLang(onSuccess) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        const parsed = JSON.parse(ev.target.result);
        if (typeof parsed !== 'object' || !parsed) throw new Error('Root must be an object');
        const name = file.name.replace(/\.json$/i, '');
        localStorage.setItem('agy_custom_lang_json', JSON.stringify(parsed));
        localStorage.setItem('agy_custom_lang_name', name);
        I18N.custom = parsed;
        setLanguage('custom');
        toast(t('lang.custom_loaded'), 'ok');
        if (onSuccess) onSuccess();
      } catch (err) {
        toast(t('lang.invalid_json') + ': ' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

function clearCustomLang() {
  localStorage.removeItem('agy_custom_lang_json');
  localStorage.removeItem('agy_custom_lang_name');
  I18N.custom = null;
  if (currentLang === 'custom') setLanguage('ru');
  toast(t('lang.custom_cleared'), 'ok');

  ov.onmousedown = e => { if (e.target === ov) close(); };

function dialog(title, fields, okText) {
  return new Promise(res => {
    const ov = h('div'); ov.id = 'modal';
    const box = h('form', 'dlg'); box.append(h('h3', '', title));
    const inputs = {};
    for (const f of fields) {
      const l = h('label', '', f.label); const i = h('input'); i.type = f.type || 'text';
      i.value = f.value || ''; i.placeholder = f.placeholder || ''; i.autocomplete = 'off'; i.spellcheck = false;
      l.append(i); box.append(l); inputs[f.name] = i;
    }
    const row = h('div', 'btns'), cancel = h('button', '', t('common.cancel')), ok = h('button', 'primary', okText || t('common.ok'));
    cancel.type = 'button'; row.append(cancel, ok); box.append(row); ov.append(box);
    const close = v => { ov.remove(); res(v); };
    box.onsubmit = e => { e.preventDefault(); close(Object.fromEntries(Object.entries(inputs).map(([k, i]) => [k, i.value.trim()]))); };
    cancel.onclick = () => close(null);
    ov.onmousedown = e => { if (e.target === ov) close(null); };
    box.onkeydown = e => { if (e.key === 'Escape') close(null); };
    document.body.append(ov);
    const first = box.querySelector('input'); if (first) { first.focus(); first.select(); }
  });
}

async function loadDir(path) {
  const r = await fetch(api('/api/tree', { project: S.project, path }));
  if (!r.ok) { if (path) { S.expanded.delete(path); delete S.children[path]; } return true; }
  const list = await r.json();
  const changed = JSON.stringify(list) !== JSON.stringify(S.children[path]);
  S.children[path] = list;
  return changed;
}
function renderTree() {
  const root = $('#tree'); root.textContent = '';
  const walk = (dir, depth) => {
    for (const e of S.children[dir] || []) {
      const p = dir ? dir + '/' + e.name : e.name;
      const code = S.gitMap[p];
      const row = h('div', 'row' + (e.dir ? ' dir' : '') + (S.active === p ? ' active' : '') + (S.sel.path === p ? ' sel' : ''));
      row.style.paddingLeft = 8 + depth * 12 + 'px';
      const nm = h('span', 'nm' + (code ? ' g-' + code : e.dir && S.gitDirs.has(p) ? ' g-dirty' : ''),
        (e.dir ? (S.expanded.has(p) ? '▾ ' : '▸ ') : '  ') + e.name);
      row.append(nm);
      if (code) row.append(h('span', 'bd g-' + code, code));
      row.title = p;
      row.onclick = async () => {
        S.sel = { path: p, dir: e.dir };
        if (!e.dir) { renderTree(); return openFile(p, undefined, false); }  // фокус остаётся в дереве (F2/Del)
        if (S.expanded.has(p)) S.expanded.delete(p);
        else { S.expanded.add(p); if (!S.children[p]) await loadDir(p); }
        renderTree();
      };
      row.oncontextmenu = ev => { S.sel = { path: p, dir: e.dir }; renderTree(); showCtx(ev, { path: p, dir: e.dir }); };
      root.append(row);
      if (e.dir && S.expanded.has(p)) walk(p, depth + 1);
    }
  };
  walk('', 0);
}
$('#tree').oncontextmenu = ev => { if (ev.target === $('#tree')) showCtx(ev, null); };
async function refreshTree() {
  let changed = false;
  for (const p of ['', ...S.expanded]) if (await loadDir(p)) changed = true;
  if (changed) renderTree();
}

const fsOp = async body => {
  const r = await post('/api/fs', { project: S.project, ...body });
  if (!r.ok) { toast(await errText(r)); return false; }
  return true;
};
const selBase = () => S.sel.dir ? S.sel.path : parentOf(S.sel.path);
async function newEntry(kind, base) {
  const v = await dialog(kind === 'file' ? t('files.new_file_title') : t('files.new_dir_title'), [{ name: 'name', label: (base ? base + '/' : '') + '…', placeholder: kind === 'file' ? t('files.new_file_ph') : t('files.new_dir_ph') }], t('common.create'));
  if (!v || !v.name) return;
  const path = (base ? base + '/' : '') + v.name.replace(/^\/+/, '');
  if (!await fsOp({ op: kind, path })) return;
  if (base) S.expanded.add(base);
  for (let d = parentOf(path); d; d = parentOf(d)) S.expanded.add(d);
  await refreshTree(); gitStatus(true);
  if (kind === 'file') openFile(path);
}
const affected = p => [...S.files.keys()].filter(k => k === p || k.startsWith(p + '/'));
async function renameEntry(tNode) {
  const v = await dialog(t('files.rename_title'), [{ name: 'to', label: tNode.path, value: tNode.path }], t('files.rename_btn'));
  if (!v || !v.to || v.to === tNode.path) return;
  const to = v.to.replace(/^\/+/, '');
  const aff = affected(tNode.path);
  if (aff.some(k => S.files.get(k).dirty)) return toast(t('files.save_dirty_first'));
  if (!await fsOp({ op: 'rename', path: tNode.path, to })) return;
  const wasActive = S.active, remap = k => to + k.slice(tNode.path.length);
  aff.forEach(k => closeFile(k, true));
  for (const k of [...S.expanded]) if (k === tNode.path || k.startsWith(tNode.path + '/')) { S.expanded.delete(k); S.expanded.add(remap(k)); }
  for (const k of Object.keys(S.children)) if (k === tNode.path || k.startsWith(tNode.path + '/')) delete S.children[k];
  S.sel = { path: to, dir: tNode.dir };
  await refreshTree(); gitStatus(true);
  for (const k of aff) await openFile(remap(k));
  if (wasActive && aff.includes(wasActive)) activate(remap(wasActive));
}
async function deleteEntry(tNode) {
  if (!confirm(t('files.delete_confirm', { path: tNode.path, all: tNode.dir ? t('files.with_contents') : '' }))) return;
  if (!await fsOp({ op: 'delete', path: tNode.path })) return;
  affected(tNode.path).forEach(k => closeFile(k, true));
  for (const k of [...S.expanded]) if (k === tNode.path || k.startsWith(tNode.path + '/')) S.expanded.delete(k);
  for (const k of Object.keys(S.children)) if (k === tNode.path || k.startsWith(tNode.path + '/')) delete S.children[k];
  S.sel = { path: '', dir: true };
  await refreshTree(); gitStatus(true);
}
$('#b-newfile').onclick = () => newEntry('file', selBase());
$('#b-newdir').onclick = () => newEntry('dir', selBase());
$('#refresh').onclick = () => { refreshTree(); gitStatus(true); };

};

// Построчный diff: каждый изменённый фрагмент становится отдельной правкой, поэтому курсор,
// прокрутка и undo вне этих фрагментов остаются на месте.
function lineEdits(cur, next) {
  const A = cur.replace(/\r\n/g, '\n').split('\n'), B = next.replace(/\r\n/g, '\n').split('\n');
  const n = A.length, m = B.length;
  let p = 0; while (p < n && p < m && A[p] === B[p]) p++;
  let q = 0; while (q < n - p && q < m - p && A[n - 1 - q] === B[m - 1 - q]) q++;
  const hunks = [], an = n - p - q, bn = m - p - q;
  if (!an && !bn) return { A, B, hunks };
  if (an * bn > 3e6 || !an || !bn) { hunks.push([p, p + an, p, p + bn]); return { A, B, hunks }; }
  const W = bn + 1, dp = new Uint32Array((an + 1) * W);
  for (let i = an - 1; i >= 0; i--) for (let j = bn - 1; j >= 0; j--)
    dp[i * W + j] = A[p + i] === B[p + j] ? dp[(i + 1) * W + j + 1] + 1 : Math.max(dp[(i + 1) * W + j], dp[i * W + j + 1]);
  let i = 0, j = 0, hi = -1, hj = -1;
  const close = () => { if (hi >= 0) { hunks.push([p + hi, p + i, p + hj, p + j]); hi = hj = -1; } };
  while (i < an || j < bn) {
    if (i < an && j < bn && A[p + i] === B[p + j]) { close(); i++; j++; continue; }
    if (hi < 0) { hi = i; hj = j; }
    if (j >= bn || (i < an && dp[(i + 1) * W + j] >= dp[i * W + j + 1])) i++; else j++;
  }
  close();
  return { A, B, hunks };
}
function patchModel(model, next) {
  const { A, B, hunks } = lineEdits(model.getValue(), next), n = A.length;
  const R = (l1, c1, l2, c2) => new monaco.Range(l1, c1, l2, c2);
  const edits = hunks.map(([a0, a1, b0, b1]) => {
    const text = B.slice(b0, b1).join('\n');
    if (a1 > a0 && b1 > b0) return { range: R(a0 + 1, 1, a1, A[a1 - 1].length + 1), text };
    if (a1 === a0) return a0 < n ? { range: R(a0 + 1, 1, a0 + 1, 1), text: text + '\n' }
                                 : { range: R(n, A[n - 1].length + 1, n, A[n - 1].length + 1), text: '\n' + text };
    if (a1 < n) return { range: R(a0 + 1, 1, a1 + 1, 1), text: '' };
    return a0 > 0 ? { range: R(a0, A[a0 - 1].length + 1, a1, A[a1 - 1].length + 1), text: '' }
                  : { range: R(1, 1, n, A[n - 1].length + 1), text: '' };
  });
  model.pushEditOperations([], edits, () => null);
  if (model.getValue().replace(/\r\n/g, '\n') !== next.replace(/\r\n/g, '\n'))  // страховка
    model.pushEditOperations([], [{ range: model.getFullModelRange(), text: next }], () => null);
}
async function reloadFile(f) {
  const r = await fetch(api('/api/file', { project: S.project, path: f.path }));
  if (!r.ok) return;

  if (f.model.getValue() !== j.content) patchModel(f.model, j.content);

}
// агент правит файлы на диске: подтягиваем изменения в открытые вкладки
let diskBusy = false, diskKick = 0;
async function checkDisk() {
  if (diskBusy || !S.project || !S.files.size) return;
  diskBusy = true;
  try {
    const proj = S.project, u = api('/api/stat', { project: proj });
    for (const p of S.files.keys()) u.searchParams.append('path', p);
    const r = await fetch(u); if (!r.ok || proj !== S.project) return;
    const st = await r.json();
    for (const f of [...S.files.values()]) {
      if (!S.files.has(f.path) || proj !== S.project) continue;
      const m = st[f.path];
      if (m == null) { if (!f.gone) { f.gone = true; renderTabs(); } continue; }
      f.gone = false;
      if (m === f.mtime) { if (f.conflict && !f.dirty) { f.conflict = false; renderTabs(); } continue; }
      if (!f.dirty) await reloadFile(f);
      else if (f.diskMtime !== m) { f.conflict = true; f.diskMtime = m; renderTabs(); }
    }
    renderTabs();
  } catch (e) { /* сеть моргнула: повторим на следующем тике */ }
  finally { diskBusy = false; }
}

/* ───────── indent-rainbow + скобки ───────── */
function setupRainbow(ed) {
  const coll = ed.createDecorationsCollection([]);
  let raf = 0;
  const run = () => {
    raf = 0;
    const m = ed.getModel();
    if (!S.rainbow || !m) return coll.clear();
    const vr = ed.getVisibleRanges(); if (!vr.length) return;
    const from = Math.max(1, vr[0].startLineNumber - 40), to = Math.min(m.getLineCount(), vr[vr.length - 1].endLineNumber + 40);
    const ts = m.getOptions().tabSize || 4;
    const noErr = ['markdown', 'plaintext'].includes(m.getLanguageId());
    const decos = [], opt = { stickiness: monaco.editor.TrackedRangeStickiness.NeverGrowsWhenTypingAtEdges };
    const add = (ln, a, b, cls) => decos.push({ range: new monaco.Range(ln, a + 1, ln, b + 1), options: { ...opt, inlineClassName: cls } });
    for (let ln = from; ln <= to; ln++) {
      const line = m.getLineContent(ln);
      let end = 0; while (end < line.length && (line[end] === ' ' || line[end] === '\t')) end++;
      if (!end || end === line.length) continue;
      let p = 0, level = 0;
      while (p < end) {
        if (line[p] === '\t') { add(ln, p, p + 1, 'ir' + (level++ % 4)); p++; continue; }
        let q = p; while (q < end && line[q] === ' ') q++;
        const n = q - p, full = Math.floor(n / ts);
        for (let k = 0; k < full; k++) add(ln, p + k * ts, p + (k + 1) * ts, 'ir' + (level++ % 4));
        if (n % ts && !noErr) add(ln, p + full * ts, q, 'irerr');
        p = q;
      }
    }
    coll.set(decos);
  };
  const sched = () => { if (!raf) raf = requestAnimationFrame(run); };
  ed.onDidChangeModelContent(sched); ed.onDidScrollChange(sched); ed.onDidChangeModel(sched); ed.onDidLayoutChange(sched);
  rainbowRuns.push(sched);
}

  const wrap = S.wrap ? 'on' : 'off';

  rainbowRuns.forEach(f => f());
}

/* ───────── git ───────── */
const gitCode = f => {
  if (f.x === 'U' || f.y === 'U' || (f.x === 'A' && f.y === 'A') || (f.x === 'D' && f.y === 'D')) return 'C';
  if (f.x === '?') return 'U';
  return f.y !== ' ' ? f.y : f.x;
};
async function gitStatus(force) {
  const proj = S.project; if (!proj) return;
  let r; try { r = await fetch(api('/api/git/status', { project: proj })); } catch (e) { return; }
  if (!r.ok || proj !== S.project) return;
  const txt = await r.text();
  if (!force && txt === S.gitRaw) return;
  S.gitRaw = txt; S.git = JSON.parse(txt);
  S.gitMap = {}; S.gitDirs = new Set();
  for (const f of S.git.files || []) {
    S.gitMap[f.path] = gitCode(f);
    for (let d = parentOf(f.path); d; d = parentOf(d)) S.gitDirs.add(d);
  }
  renderGit(); renderTree();
  if (S.diffOn) refreshDiff();
}
async function loadBranches() {
  if (!S.git.repo) return;
  const r = await fetch(api('/api/git/branches', { project: S.project })); if (!r.ok) return;
  const { local, remote } = await r.json();
  const sel = $('#branch'); sel.textContent = '';
  const cur = (S.git.branch || {}).name, seen = new Set(local);
  const add = (v, tText) => { const o = h('option', '', tText); o.value = v; sel.append(o); };
  if (cur && !seen.has(cur)) add(cur, cur);
  for (const b of local) add(b, b);
  for (const rb of remote) { const s = rb.slice(rb.indexOf('/') + 1); if (!seen.has(s)) { seen.add(s); add(s, rb + t('git.remote_branch_tag')); } }
  sel.value = cur;
}
async function loadLog() {
  const r = await fetch(api('/api/git/log', { project: S.project })); if (!r.ok) return;
  const box = $('#g-log'); box.textContent = '';

  if (!list.length) box.append(h('div', 'note', t('git.no_commits')));
  for (const c of list) {
    const d = h('div', 'logl'); d.title = `${c.subject}\n${c.author}, ${c.when}`;
    d.append(h('b', '', c.hash), document.createTextNode(c.subject + ' '), h('i', '', '· ' + c.author + ', ' + c.when));

  }
}
$('#g-logbox').ontoggle = () => { if ($('#g-logbox').open) loadLog(); };
function gitRow(f, staged) {
  const code = staged ? f.x : gitCode(f);
  const row = h('div', 'grow'); row.title = f.path;
  row.append(h('span', 'l g-' + code, code));
  const n = h('span', 'n', f.path.split('/').pop()); if (f.path.includes('/')) n.append(h('i', '', parentOf(f.path)));
  row.append(n);
  const acts = h('span', 'acts');

function renderGit() {
  const g = S.git;

async function gitOp(op, body = {}, quiet) {

let searchCtl, searchTimer;
const runSearch = () => { clearTimeout(searchTimer); searchTimer = setTimeout(doSearch, 300); };
async function doSearch() {
  const q = $('#q').value, box = $('#results');
  if (searchCtl) searchCtl.abort();
  if (q.length < 2) { box.textContent = ''; return; }
  searchCtl = new AbortController();
  box.textContent = ''; box.append(h('div', 'note', t('search.searching')));
  let j;
  try {
    const r = await fetch(api('/api/search', { project: S.project, q, regex: $('#o-regex').checked ? 1 : 0, case: $('#o-case').checked ? 1 : 0 }), { signal: searchCtl.signal });
    if (!r.ok) { box.textContent = ''; return toast(await errText(r)); }
    j = await r.json();
  } catch (e) { return; }
  box.textContent = '';
  const note = txt => box.append(h('div', 'note', txt));
  if (j.error) return note(t('search.regex_error', { err: j.error }));
  if (!j.files.length && !j.matches.length) return note(t('search.not_found'));
  if (j.files.length) {
    box.append(h('div', 'res-head', t('search.files_count', { count: j.files.length })));
    for (const p of j.files) { const d = h('div', 'res-file', p); d.title = p; d.onclick = () => openFile(p); box.append(d); }
  }
  const groups = new Map();
  for (const m of j.matches) { if (!groups.has(m.path)) groups.set(m.path, []); groups.get(m.path).push(m); }
  for (const [p, list] of groups) {
    const hd = h('div', 'res-head', `${p} (${list.length})`); hd.title = p; box.append(hd);
    for (const m of list) {
      const d = h('div', 'res-line'); d.append(h('b', '', m.line), document.createTextNode(m.text)); d.title = m.text;
      d.onclick = () => openFile(p, m.line); box.append(d);
    }
  }
  if (j.truncated) note(t('search.truncated'));
}
$('#q').oninput = runSearch;

const term = new Terminal({ fontSize: 13, cursorBlink: true, scrollback: 5000, theme: { background: '#1e1e1e' }, allowProposedApi: true });
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open($('#term-body'));
let ws = null, ended = false;
function connect() {
  if (!S.project) return;
  if (ws) { ws.onclose = null; ws.close(); }
  term.reset(); fit.fit();
  const u = api('/ws/term', { project: S.project, cols: term.cols, rows: term.rows });
  u.protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
  const sock = ws = new WebSocket(u);
  sock.binaryType = 'arraybuffer';
  sock.onmessage = e => {
    if (typeof e.data === 'string') {
      if (JSON.parse(e.data).type === 'exit') { ended = true; term.write('\r\n\x1b[33m' + t('term.process_ended') + '\x1b[0m\r\n'); }
    } else { term.write(new Uint8Array(e.data)); kickDiskCheck(); }
  };
  sock.onclose = () => { if (sock === ws && !ended) setTimeout(() => sock === ws && connect(), 1500); };
}
term.onData(d => {
  if (ended) { ended = false; connect(); return; }
  if (ws && ws.readyState === 1) ws.send(new TextEncoder().encode(d));
});
term.onResize(({ cols, rows }) => { if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: 'resize', cols, rows })); });
let fitRaf; new ResizeObserver(() => { cancelAnimationFrame(fitRaf); fitRaf = requestAnimationFrame(() => { try { fit.fit(); } catch (e) {} }); }).observe($('#term-body'));

};

/* ───────── лимиты ───────── */
let limitsLoading = false;
async function fetchLimits(force = false) {
  if (limitsLoading) return S.limits;
  limitsLoading = true;
  try {
    if (force || !S.limits) renderLimits({ loading: true });
    const u = api('/api/limits', { project: S.project, refresh: force ? '1' : '0' });
    const r = await fetch(u);
    if (!r.ok) {
      S.limits = { ok: false, error: await errText(r) };
    } else {
      S.limits = await r.json();
    }
  } catch (e) {
    S.limits = { ok: false, error: e.message };
  } finally {
    limitsLoading = false;
  }
  renderLimits(S.limits);
  return S.limits;
}

const fmtPct = frac => (frac == null ? '—' : (Math.round(frac * 10000) / 100) + '%');
const fmtUsedPct = frac => (frac == null ? '—' : (Math.round((1 - frac) * 10000) / 100) + '%');

function renderLimits(data) {
  const wrap = $('#limits-wrap');
  if (!wrap) return;
  if (!data) { wrap.textContent = ''; return; }
  if (data.disabled) { wrap.style.display = 'none'; return; }
  wrap.style.display = 'flex';
  wrap.textContent = '';

  if (data.loading) {
    const chip = h('div', 'limit-chip loading');
    chip.append(h('span', 'grp', t('limits.loading')));
    chip.title = t('limits.loading_tip');
    chip.onclick = () => showLimitsModal();
    wrap.append(chip);
    return;
  }

  const items = data.items || {};
  const groups = Object.keys(items);
  if (!data.ok || !groups.length) {
    const chip = h('div', 'limit-chip err');
    chip.append(h('span', '', t('limits.err_chip')));
    chip.title = (data.error || t('limits.err_default')) + '\n' + t('limits.click_details');
    chip.onclick = () => showLimitsModal();
    wrap.append(chip);
    return;
  }

  for (const grp of groups) {
    const wins = items[grp];
    if (!wins || !Object.keys(wins).length) continue;
    const chip = h('div', 'limit-chip');
    const grpName = t('limits.groups.' + grp) || grp;
    chip.append(h('span', 'grp', grpName));

    let tip = `${grpName}:\n`;
    for (const [w, it] of Object.entries(wins)) {
      const exactPct = fmtPct(it.remaining);
      const usedPct = fmtUsedPct(it.remaining);
      const pctNum = Math.round(it.remaining * 100);
      const statusCls = pctNum >= 50 ? 'ok' : pctNum >= 20 ? 'warn' : 'crit';
      const winName = t('limits.windows.' + w) || w;
      const winShort = t('limits.windows_short.' + w) || w;

      const itemWrap = h('span', 'limit-item');

      const valSpan = h('span', 'val ' + statusCls, exactPct);
      valSpan.append(h('span', 'win', winShort));

      const pbar = h('span', 'limit-mini-bar');
      const pfill = h('span', 'limit-mini-fill ' + statusCls);
      pfill.style.width = Math.max(0, Math.min(100, pctNum)) + '%';
      pbar.append(pfill);

      const tipText = `${grpName} (${winName}): ` + t('limits.rem', { pct: exactPct }) +
        ` (${t('limits.used', { pct: usedPct })})` + (it.reset ? ` · ${t('limits.reset', { val: it.reset })}` : '') +
        (it.assumed ? t('limits.assumed') : '');
      const tipBox = h('span', 'limit-tip', tipText);

      itemWrap.append(valSpan, pbar, tipBox);
      itemWrap.title = tipText;
      chip.append(itemWrap);

      tip += `• ${winName}: ` + t('limits.rem', { pct: exactPct }) + ` (${t('limits.used', { pct: usedPct })})` +
        (it.reset ? ` (${t('limits.reset', { val: it.reset })})` : '') + (it.assumed ? t('limits.assumed') : '') + '\n';
    }

    if (data.age != null) {
      const ageStr = data.age < 60 ? t('limits.sec_ago', { n: data.age }) : t('limits.min_ago', { n: Math.round(data.age / 60) });
      tip += `\n${ageStr}`;
    }
    tip += '\n' + t('limits.click_details_refresh');
    chip.title = tip.trim();
    chip.onclick = () => showLimitsModal();
    wrap.append(chip);
  }
}

function showLimitsModal() {
  const d = S.limits || { items: {}, error: t('limits.not_loaded') };
  const ov = h('div'); ov.id = 'modal';
  const box = h('div', 'dlg wide');
  box.append(h('h3', '', t('limits.title')));

  const contentBox = h('div');
  box.append(contentBox);

  const renderModalBody = (data) => {
    contentBox.textContent = '';
    if (data.error && (!data.items || !Object.keys(data.items).length)) {
      contentBox.append(h('div', 'note', '⚠ ' + data.error));
    } else {
      if (data.error) contentBox.append(h('div', 'note', '⚠ ' + data.error));
      const tbl = h('table', 'limits-table');
      const thead = h('thead');
      const trh = h('tr');
      for (const thText of [t('limits.col_model'), t('limits.col_window'), t('limits.col_left'), t('limits.col_bar'), t('limits.col_reset')]) {
        trh.append(h('th', '', thText));
      }
      thead.append(trh);
      tbl.append(thead);

      const tbody = h('tbody');
      for (const [grp, wins] of Object.entries(data.items || {})) {
        for (const [w, it] of Object.entries(wins)) {
          const tr = h('tr');
          const grpName = (t('limits.groups.' + grp) || grp) + (it.assumed ? t('limits.assumed') : '');
          const winName = t('limits.windows.' + w) || w;
          tr.append(h('td', '', grpName));
          tr.append(h('td', '', winName));
          const exactPct = fmtPct(it.remaining);
          const usedPct = fmtUsedPct(it.remaining);
          const pctNum = Math.round(it.remaining * 100);
          const statusCls = pctNum >= 50 ? 'ok' : pctNum >= 20 ? 'warn' : 'crit';
          const tdRem = h('td', 'val ' + statusCls, exactPct);
          const sm = h('small', '', t('limits.used_paren', { pct: usedPct }));
          sm.style.color = 'var(--dim)';
          sm.style.marginLeft = '4px';
          tdRem.append(sm);
          tr.append(tdRem);

          const tdBar = h('td');
          const pbar = h('div', 'limits-pbar');
          const pfill = h('div', 'limits-pfill ' + statusCls);
          pfill.style.width = Math.max(0, Math.min(100, pctNum)) + '%';
          pfill.style.background = pctNum >= 50 ? '#73c991' : pctNum >= 20 ? '#e2c08d' : '#f14c4c';
          pbar.title = `${exactPct} ` + t('limits.used_paren', { pct: usedPct });
          pbar.append(pfill);
          tdBar.append(pbar);
          tr.append(tdBar);

          tr.append(h('td', '', it.reset || '—'));
          tbody.append(tr);
        }
      }
      tbl.append(tbody);
      contentBox.append(tbl);
    }

    const info = h('div', 'note');
    let infoText = '';
    if (data.age != null) {
      const ageStr = data.age < 60 ? t('limits.sec_ago', { n: data.age }) : t('limits.min_ago', { n: Math.round(data.age / 60) });
      infoText = t('limits.info', { age: ageStr });
    } else {
      infoText = t('limits.info_no_age');
    }
    info.textContent = infoText;
    contentBox.append(info);

    if (data.raw) {
      const det = h('details');
      det.style.marginTop = '8px';
      const sum = h('summary', '', t('limits.raw_screen'));
      sum.style.color = 'var(--dim)';
      sum.style.cursor = 'pointer';
      sum.style.fontSize = '12px';
      det.append(sum);
      const pre = h('pre', 'limits-raw', data.raw);
      det.append(pre);
      contentBox.append(det);
    }
  };

  renderModalBody(d);

  const row = h('div', 'btns');
  const closeBtn = h('button', '', t('common.close'));
  const refreshBtn = h('button', 'primary', t('limits.refresh_now'));
  closeBtn.type = refreshBtn.type = 'button';
  row.append(closeBtn, refreshBtn);
  box.append(row);
  ov.append(box);

  const close = () => ov.remove();
  closeBtn.onclick = close;
  ov.onmousedown = e => { if (e.target === ov) close(); };
  box.onkeydown = e => { if (e.key === 'Escape') close(); };

  refreshBtn.onclick = async () => {
    refreshBtn.disabled = true;
    refreshBtn.textContent = t('limits.refreshing');
    const fresh = await fetchLimits(true);
    refreshBtn.disabled = false;
    refreshBtn.textContent = t('limits.refresh_now');
    renderModalBody(fresh);
  };

  document.body.append(ov);
}

/* ───────── сплиттеры ───────── */
function dragger(el, onmove) {
  el.onpointerdown = e => {
    el.setPointerCapture(e.pointerId); el.classList.add('drag');
    el.onpointermove = onmove;
    el.onpointerup = () => { el.classList.remove('drag'); el.onpointermove = null; };
  };
}
const rootStyle = document.documentElement.style;
if (localStorage.sidew) rootStyle.setProperty('--sidew', localStorage.sidew);
if (localStorage.termh) rootStyle.setProperty('--termh', localStorage.termh);
dragger($('#splitV'), e => { const w = Math.max(200, Math.min(e.clientX, innerWidth - 300)) + 'px'; rootStyle.setProperty('--sidew', w); localStorage.sidew = w; });
dragger($('#splitH'), e => {
  const totalH = window.visualViewport ? window.visualViewport.height : innerHeight;
  const isMob = window.innerWidth <= 768;
  const bottomOffset = isMob ? 52 : 0;
  const v = Math.max(80, Math.min(totalH - e.clientY - bottomOffset, totalH - 120)) + 'px';
  rootStyle.setProperty('--termh', v);
  localStorage.termh = v;
  if (isMob) {
    try { fit.fit(); } catch (err) {}
    try { if (editor) editor.layout(); } catch (err) {}
  }
});

function setMobileView(view) {
  if (!['sidebar', 'editor', 'terminal', 'split'].includes(view)) view = 'terminal';
  document.body.dataset.mobView = view;
  localStorage.setItem('agy_mob_view', view);
  document.querySelectorAll('#mobile-nav .mob-btn').forEach(btn => {
    btn.classList.toggle('on', btn.dataset.mobTab === view);
  });
  if (view === 'editor' || view === 'split') {
    requestAnimationFrame(() => {
      try { if (editor) editor.layout(); if (diffEditor) diffEditor.layout(); } catch (e) {}
    });
  }
  if (view === 'terminal' || view === 'split') {
    requestAnimationFrame(() => {
      try { fit.fit(); } catch (e) {}
    });
  }
}

// Быстрые клавиши мобильного терминала (Esc, Tab, Ctrl+C, стрелки, 1/2/3, y/n, Enter)
function sendTerm(data) {
  if (ended) { ended = false; connect(); return; }
  if (ws && ws.readyState === 1) {
    ws.send(new TextEncoder().encode(data));
    if (navigator.vibrate) try { navigator.vibrate(8); } catch (e) {}
  }
}
const KEY_MAP = {
  esc: '\x1b', tab: '\t', 'ctrl-c': '\x03',
  up: '\x1b[A', down: '\x1b[B', left: '\x1b[D', right: '\x1b[C',
  '1': '1', '2': '2', '3': '3', y: 'y', n: 'n', enter: '\r'
};
document.querySelectorAll('#term-keys .tkey').forEach(btn => {
  btn.onpointerdown = e => {
    e.preventDefault();
    const k = btn.dataset.k;
    if (KEY_MAP[k]) sendTerm(KEY_MAP[k]);
  };
});

// Адаптация под виртуальную клавиатуру и ориентацию мобильных устройств
function handleViewport() {
  if (window.innerWidth <= 768) {
    const h = window.visualViewport ? window.visualViewport.height : window.innerHeight;
    document.documentElement.style.setProperty('--vh', h + 'px');
    try { fit.fit(); } catch (e) {}
    try { if (editor) editor.layout(); if (diffEditor) diffEditor.layout(); } catch (e) {}
  } else {
    document.documentElement.style.removeProperty('--vh');
  }
}
if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', handleViewport);
  window.visualViewport.addEventListener('scroll', handleViewport);
}
window.addEventListener('resize', handleViewport);
window.addEventListener('orientationchange', () => setTimeout(handleViewport, 150));
handleViewport();

/* ───────── горячие клавиши ───────── */
addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey;
  if (mod && e.shiftKey && e.code === 'KeyF') { e.preventDefault(); showTab('search'); }
  else if (mod && e.shiftKey && e.code === 'KeyG') { e.preventDefault(); showTab('git'); }
  else if (mod && e.code === 'KeyS') { e.preventDefault(); const f = S.files.get(S.active); if (f) save(f); }
});
addEventListener('beforeunload', e => { if ([...S.files.values()].some(f => f.dirty)) { e.preventDefault(); e.returnValue = ''; } });

/* ───────── старт ───────── */
// Monaco отменяет свои асинхронные запросы при закрытии моделей — это не ошибка
addEventListener('unhandledrejection', e => { if (e.reason && e.reason.message === 'Canceled') e.preventDefault(); });
addEventListener('error', e => { if (e.message && e.message.includes('Canceled')) e.preventDefault(); });
window.MonacoEnvironment = {
  getWorkerUrl: () => URL.createObjectURL(new Blob(
    [`self.MonacoEnvironment={baseUrl:'${MONACO}/'};importScripts('${MONACO}/vs/base/worker/workerMain.js');`], { type: 'text/javascript' }))
};
require.config({
  paths: { vs: MONACO + '/vs' },
  'vs/nls': { availableLanguages: { '*': currentLang === 'ru' ? 'ru' : '' } }
});
require(['vs/editor/editor.main'], async () => {
  monaco = window.monaco;
  $('#btn-lang').onclick = showLangModal;
  const common = {
    theme: 'vs-dark', automaticLayout: true, minimap: { enabled: false }, fontSize: 13, scrollBeyondLastLine: false,
    bracketPairColorization: { enabled: true, independentColorPoolPerBracketType: true },
    guides: { bracketPairs: true, indentation: true, highlightActiveIndentation: true },
    matchBrackets: 'always', renderWhitespace: 'selection', detectIndentation: true, wordWrap: S.wrap ? 'on' : 'off',
  };
  editor = monaco.editor.create($('#editor'), common);
  diffEditor = monaco.editor.createDiffEditor($('#diff'), { ...common, renderSideBySide: true, originalEditable: false, ignoreTrimWhitespace: false });
  const saveCmd = () => { const f = S.files.get(S.active); if (f) save(f); };
  const key = monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS;
  editor.addCommand(key, saveCmd); diffEditor.getModifiedEditor().addCommand(key, saveCmd);
  setupRainbow(editor); setupRainbow(diffEditor.getModifiedEditor()); applyToggles();
  await loadProjects();
  if (!S.projects.length) return toast(t('projects.none'));
  const saved = localStorage.getItem('project');
  const first = S.projects.find(p => p.id !== '_root') || S.projects[0];
  await setProject(S.projects.some(p => p.id === saved) ? saved : first.id);
});
</script>
</body>
